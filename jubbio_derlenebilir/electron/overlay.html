    .px-1\.5{padding-left:6px;padding-right:6px}

    .px-3{padding-left:12px;padding-right:12px}
    .px-4{padding-left:16px;padding-right:16px}
    .py-0\.5{padding-top:2px;padding-bottom:2px}
    .py-1{padding-top:4px;padding-bottom:4px}
    .py-1\.5{padding-top:6px;padding-bottom:6px}
    .py-2{padding-top:8px;padding-bottom:8px}
    .py-3{padding-top:12px;padding-bottom:12px}
    .pb-2{padding-bottom:8px}
    .pt-1{padding-top:4px} .pt-3{padding-top:12px} .pt-4{padding-top:16px}

    /* Backgrounds — solid */
    .bg-white{background-color:#fff}
    .bg-slate-700{background-color:#334155}
    .bg-slate-800{background-color:#1e293b}
    .bg-slate-900{background-color:#0f172a}

    .bg-green-400{background-color:#4ade80}
    .bg-red-500{background-color:#ef4444}
    .bg-accent{background-color:#adff08}

    /* Backgrounds — with opacity */

    .bg-accent\/20{background-color:rgba(173,255,8,.20)}

    .bg-green-500\/30{background-color:rgba(34,197,94,.30)}

    /* Text colors */
    .text-white{color:#fff} .text-black{color:#000}
    .text-slate-100{color:#f1f5f9} .text-slate-200{color:#e2e8f0}
    .text-slate-300{color:#cbd5e1} .text-slate-400{color:#94a3b8}
    .text-slate-500{color:#64748b}
    .text-accent{color:#adff08}
    .text-yellow-400{color:#facc15} .text-green-400{color:#4ade80}
    .text-red-400{color:#f87171}
    .text-\[\#e74856\]{color:#e74856}

    /* Font sizes (arbitrary) */
    .text-\[9px\]{font-size:9px} .text-\[10px\]{font-size:10px}
    .text-\[11px\]{font-size:11px} .text-\[12px\]{font-size:12px}
    .text-\[13px\]{font-size:13px}

    /* Font weight */
    .font-medium{font-weight:500} .font-semibold{font-weight:600}
    .font-bold{font-weight:700}

    /* Text utilities */
    .tabular-nums{font-variant-numeric:tabular-nums}
    .tracking-wide{letter-spacing:0.025em}
    .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .uppercase{text-transform:uppercase}
    .text-center{text-align:center}

    /* Borders */
    .border{border-width:1px;border-style:solid}
    .border-2{border-width:2px;border-style:solid}
    .border-t{border-top-width:1px;border-top-style:solid}
    .border-slate-600{border-color:#475569}
    .border-slate-700{border-color:#334155}
    .border-slate-800{border-color:#1e293b}
    .border-accent{border-color:#adff08}
    .border-transparent{border-color:transparent}
    .border-slate-500\/80{border-color:rgba(100,116,139,.80)}
    .border-slate-700\/40{border-color:rgba(51,65,85,.40)}
    .border-slate-700\/60{border-color:rgba(51,65,85,.60)}
    .border-slate-800\/60{border-color:rgba(30,41,59,.60)}
    .border-slate-800\/80{border-color:rgba(30,41,59,.80)}
    .border-accent\/30{border-color:rgba(173,255,8,.30)}
    .border-t-accent{border-top-color:#adff08}

    /* Shadows */
    .shadow-lg{box-shadow:0 10px 15px -3px rgba(0,0,0,.10),0 4px 6px -4px rgba(0,0,0,.10)}
    .shadow-xl{box-shadow:0 20px 25px -5px rgba(0,0,0,.10),0 8px 10px -6px rgba(0,0,0,.10)}
    .shadow-2xl{box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
    .shadow-xl.shadow-black\/30{box-shadow:0 20px 25px -5px rgba(0,0,0,.30),0 8px 10px -6px rgba(0,0,0,.30)}
    .shadow-2xl.shadow-black\/50{box-shadow:0 25px 50px -12px rgba(0,0,0,.50)}
    .shadow-2xl.shadow-black\/60{box-shadow:0 25px 50px -12px rgba(0,0,0,.60)}
    .shadow-xl.shadow-black\/40{box-shadow:0 20px 25px -5px rgba(0,0,0,.40),0 8px 10px -6px rgba(0,0,0,.40)}
    .shadow-\[0_0_8px_rgba\(173\,255\,8\,0\.15\)\]{box-shadow:0 0 8px rgba(173,255,8,.15)}

    /* Backdrop blur */
    .backdrop-blur-sm{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
    .backdrop-blur-md{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
    .backdrop-blur-xl{-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}

    /* Opacity */
    .opacity-40{opacity:.40} .opacity-50{opacity:.50} .opacity-60{opacity:.60}

    /* Object fit */
    .object-contain{object-fit:contain} .object-cover{object-fit:cover}

    /* Aspect ratio */
    .aspect-video{aspect-ratio:16/9}

    /* Transform */
    .-translate-x-1\/2{--tw-tx:-50%;transform:translateX(var(--tw-tx,0)) translateY(var(--tw-ty,0))}
    .-translate-y-1\/2{--tw-ty:-50%;transform:translateX(var(--tw-tx,0)) translateY(var(--tw-ty,0))}

    /* Cursor */
    .cursor-pointer{cursor:pointer} .cursor-grab{cursor:grab}
    .active\:cursor-grabbing:active{cursor:grabbing}

    /* Transitions */
    .transition-all{transition:all 150ms cubic-bezier(.4,0,.2,1)}
    .transition-colors{transition:color,background-color,border-color 150ms cubic-bezier(.4,0,.2,1)}
    .transition-opacity{transition:opacity 150ms cubic-bezier(.4,0,.2,1)}
    .transition-transform{transition:transform 150ms cubic-bezier(.4,0,.2,1)}
    .duration-100{transition-duration:100ms}
    .duration-150{transition-duration:150ms}
    .duration-500{transition-duration:500ms}

    /* Appearance */
    .appearance-none{appearance:none;-webkit-appearance:none}

    /* Gradient */
    .bg-gradient-to-t.from-black\/80.via-transparent.to-transparent{
      background-image:linear-gradient(to top,rgba(0,0,0,.80),transparent,transparent)
    }

    /* Animation */
    .animate-spin{animation:spin .6s linear infinite}

    /* Hover states */
    .hover\:bg-white\/10:hover{background-color:rgba(255,255,255,.10)}
    .hover\:bg-slate-700:hover{background-color:#334155}
    .hover\:bg-slate-800:hover{background-color:#1e293b}
    .hover\:bg-red-500\/20:hover{background-color:rgba(239,68,68,.20)}
    .hover\:bg-red-500\/30:hover{background-color:rgba(239,68,68,.30)}
    .hover\:bg-yellow-500\/20:hover{background-color:rgba(234,179,8,.20)}
    .hover\:bg-yellow-500\/30:hover{background-color:rgba(234,179,8,.30)}
    .hover\:bg-green-500\/20:hover{background-color:rgba(34,197,94,.20)}
    .hover\:bg-green-500\/30:hover{background-color:rgba(34,197,94,.30)}
    .hover\:bg-accent\/90:hover{background-color:rgba(173,255,8,.90)}
    .hover\:bg-red-600:hover{background-color:#dc2626}
    .hover\:bg-\[\#c42b1c\]:hover{background-color:#c42b1c}
    .hover\:border-slate-600:hover{border-color:#475569}
    .hover\:border-slate-700:hover{border-color:#334155}
    .hover\:text-white:hover{color:#fff}
    .hover\:text-slate-300:hover{color:#cbd5e1}

    /* Disabled states */
    .disabled\:opacity-40:disabled{opacity:.40}
    .disabled\:cursor-not-allowed:disabled{cursor:not-allowed}
    /* === End Tailwind utility replacements === */

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.45) !important;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-app-region: no-drag;
      -webkit-font-smoothing: antialiased;
    }

    .panel-scroll::-webkit-scrollbar { width: 4px; }
    .panel-scroll::-webkit-scrollbar-track { background: transparent; }
    .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .panel-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
    #server-list::-webkit-scrollbar { height: 0; }
    .server-icon { transition: background 0.1s ease; }
    .server-icon.loading { pointer-events: none; opacity: 0.7; }
    .server-icon.loading .server-spinner { display: flex; }
    .server-icon.loading img,
    .server-icon.loading span { opacity: 0.3; }
    .server-spinner {
      display: none;
      position: absolute; inset: 0;
      align-items: center; justify-content: center;
    }
    .server-spinner::after {
      content: '';
      width: 14px; height: 14px;
      border: 2px solid rgba(173,255,8,0.2);
      border-top-color: #adff08;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-tooltip {
      animation: tooltipIn 0.12s ease-out;
    }
    @keyframes tooltipIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #chat-dropdown:not(.hidden) {
      animation: dropdownIn 0.15s ease-out;
    }
    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- ══════════ TOP BAR ══════════ -->
  <div class="fixed top-0 left-0 right-0 z-40 pointer-events-none flex items-start justify-center pt-4">
    <div class="pointer-events-auto">
      <div class="flex items-center bg-slate-900/95 backdrop-blur-md border border-slate-800/80 px-3 py-1.5 shadow-xl shadow-black/30" style="border-radius:12px;">

        <!-- Logo -->
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 413 417" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M90.5933 405.5C14.5933 369.1-1.40668 299.333.09332 269C25.2934 291.8 43.9266 298.833 50.0933 299.5L45.5933 294.5C44.7933 284.5 51.2599 279.333 54.5933 278C66.1933 291.2 78.4266 299.167 83.0933 301.5L81.0933 296.5C85.8933 285.3 100.427 285.5 107.093 287C117.093 322.2 154.26 326 171.593 323.5C156.393 373.1 111.26 398.833 90.5933 405.5Z" fill="#ADFF08"/>

        </svg>

        <!-- Server list -->
        <div id="server-bar" class="hidden">
          <div class="flex items-center">
            <div class="w-px h-5 bg-slate-700/60 mx-2.5"></div>
            <div id="server-list" class="flex items-center gap-1" style="max-width:50vw; overflow-x:auto;"></div>
          </div>
        </div>

        <!-- Divider -->
        <div class="w-px h-5 bg-slate-700/60 mx-2.5"></div>

        <!-- Clock -->
        <span id="overlay-clock" class="text-slate-200 text-[12px] font-medium tabular-nums tracking-wide">00:00</span>

        <!-- Battery -->
        <div id="battery-wrap" class="hidden flex items-center gap-1.5">
          <div class="w-px h-3.5 bg-slate-700/60 ml-2"></div>
          <div class="relative flex items-center ml-0.5">
            <div class="w-[20px] h-[10px] border border-slate-500/80 flex items-center p-px" style="border-radius:2px;">
              <div id="battery-fill" class="h-full bg-accent" style="border-radius:1px; width:80%;"></div>
            </div>
            <div class="w-[2px] h-[4px] bg-slate-500/80 -ml-px" style="border-radius:0 1px 1px 0;"></div>
          </div>
          <span id="battery-pct" class="text-slate-400 text-[10px] font-medium tabular-nums">80%</span>
          <span id="battery-charging" class="hidden">

        <!-- Chat Widget Button -->
        <div class="relative">
          <div class="w-px h-3.5 bg-slate-700/60 mx-2"></div>
        </div>
        <div class="relative">
          <button id="btn-chat-dropdown" class="w-7 h-7 flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all duration-150" style="border-radius:6px;" title="Sohbet Widget">
            <svg class="w-4 h-4 text-slate-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2S2 6.477 2 12c0 1.6.376 3.112 1.043 4.453c.178.356.237.763.134 1.148l-.595 2.226a1.3 1.3 0 0 0 1.591 1.592l2.226-.596a1.63 1.63 0 0 1 1.149.133A9.96 9.96 0 0 0 12 22" opacity="0.5"/><path fill="currentColor" d="M7.825 12.85a.825.825 0 0 0 0 1.65h6.05a.825.825 0 0 0 0-1.65zm0-3.85a.825.825 0 0 0 0 1.65h8.8a.825.825 0 0 0 0-1.65z"/></svg>

                <span class="text-slate-200 text-[13px] font-semibold">Sohbet Widget</span>

                  </div>
                </label>
              </div>
              <!-- Channel selector (shown when enabled) -->
              <div id="chat-channel-selector" class="hidden flex flex-col gap-2">

                <select id="chat-guild-select" class="w-full h-8 bg-slate-800 border border-slate-700 text-slate-200 text-[12px] px-2 appearance-none cursor-pointer" style="border-radius:6px;">

                </select>
                <!-- Channel select (shown when guild selected) -->
                <div id="chat-channel-wrap" class="hidden flex flex-col gap-2">
                  <select id="chat-channel-select" class="w-full h-8 bg-slate-800 border border-slate-700 text-slate-200 text-[12px] px-2 appearance-none cursor-pointer" style="border-radius:6px;">
                    <option value="">Kanal seç...</option>
                  </select>

    const btnScreen = document.getElementById('btn-screen');
    const btnScrSettings = document.getElementById('btn-screen-settings');
    const btnDisconnect = document.getElementById('btn-disconnect');
    const iconMicOn = document.getElementById('icon-mic-on');
    const iconMicOff = document.getElementById('icon-mic-off');
    const iconCamera = document.getElementById('icon-camera');
    const iconScreen = document.getElementById('icon-screen');
    const hint = document.getElementById('shortcut-hint');
    const serverBar = document.getElementById('server-bar');
    const serverListEl = document.getElementById('server-list');

    setTimeout(() => { hint.style.opacity = '0'; }, 3000);
    setTimeout(() => { hint.remove(); }, 3600);

    // ── Participant icons ──
    const MIC_ICON = '<svg class="w-4 h-4 text-slate-500 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M4 9a.75.75 0 0 1 .75.75v1a7.25 7.25 0 1 0 14.5 0v-1a.75.75 0 0 1 1.5 0v1a8.75 8.75 0 0 1-8 8.718v2.282a.75.75 0 0 1-1.5 0v-2.282a8.75 8.75 0 0 1-8-8.718v-1A.75.75 0 0 1 4 9" clip-rule="evenodd"/><path fill="currentColor" fill-rule="evenodd" d="M12 2a5.75 5.75 0 0 0-5.75 5.75v3a5.75 5.75 0 0 0 11.5 0v-3A5.75 5.75 0 0 0 12 2" clip-rule="evenodd" opacity="0.5"/></svg>';
    const MIC_OFF_ICON = '<svg class="w-4 h-4 text-[#e74856] flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M4 9a.75.75 0 0 1 .75.75v1a7.25 7.25 0 1 0 14.5 0v-1a.75.75 0 0 1 1.5 0v1a8.75 8.75 0 0 1-8 8.718v2.282a.75.75 0 0 1-1.5 0v-2.282a8.75 8.75 0 0 1-8-8.718v-1A.75.75 0 0 1 4 9" clip-rule="evenodd"/><path fill="currentColor" fill-rule="evenodd" d="M12 2a5.75 5.75 0 0 0-5.75 5.75v3a5.75 5.75 0 0 0 11.5 0v-3A5.75 5.75 0 0 0 12 2" clip-rule="evenodd" opacity="0.5"/><line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
    const MIC_SPEAK_ICON = '<svg class="w-4 h-4 text-accent flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M4 9a.75.75 0 0 1 .75.75v1a7.25 7.25 0 1 0 14.5 0v-1a.75.75 0 0 1 1.5 0v1a8.75 8.75 0 0 1-8 8.718v2.282a.75.75 0 0 1-1.5 0v-2.282a8.75 8.75 0 0 1-8-8.718v-1A.75.75 0 0 1 4 9" clip-rule="evenodd"/><path fill="currentColor" fill-rule="evenodd" d="M12 2a5.75 5.75 0 0 0-5.75 5.75v3a5.75 5.75 0 0 0 11.5 0v-3A5.75 5.75 0 0 0 12 2" clip-rule="evenodd" opacity="0.5"/></svg>';
    const DEAFEN_ICON = '<svg class="w-4 h-4 text-[#e74856] flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75v2.793a.75.75 0 0 1 1 .707v2a.75.75 0 0 1-1.5 0V17h-1v-5a8.25 8.25 0 0 0-16.5 0v5h-1v.5a.75.75 0 0 1-1.5 0v-2a.75.75 0 0 1 1-.707z" clip-rule="evenodd" opacity="0.5"/><path fill="currentColor" d="M8 14.05c0-.85 0-1.274-.21-1.57a1.2 1.2 0 0 0-.409-.358c-.325-.174-.763-.134-1.64-.053c-1.48.134-2.218.202-2.748.571a2.35 2.35 0 0 0-.661.7C2 13.885 2 14.6 2 16.03v1.74c0 1.417 0 2.126.338 2.673c.127.205.286.39.471.547c.495.423 1.217.555 2.662.818c1.016.186 1.525.279 1.9.083q.209-.11.36-.287C8 21.285 8 20.786 8 19.789zm8 0c0-.85 0-1.274.21-1.57c.105-.148.245-.271.409-.358c.325-.174.763-.134 1.64-.053c1.48.134 2.218.202 2.748.571c.268.188.493.426.661.7c.332.544.332 1.26.332 2.69v1.74c0 1.417 0 2.126-.338 2.673c-.127.205-.286.39-.471.547c-.495.423-1.217.555-2.662.818c-1.016.186-1.525.279-1.9.083a1.2 1.2 0 0 1-.36-.287C16 21.285 16 20.786 16 19.789z"/><path fill="none" d="M20 4l-16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function initials(n) { return n ? n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase() : '?'; }
    function pHash(s) { return !s.participants ? '' : s.participants.map(p=>p.id+':'+p.isSpeaking+':'+p.isMuted+':'+p.name+':'+(p.avatar||'')).join('|'); }
    function cHash(s) { return [s.isMuted,s.isCameraOn,s.isScreenSharing].join(':'); }
    function gHash(s) {
      const gh = !s.guilds ? '' : s.guilds.map(g=>g.id+':'+g.name+':'+(g.avatar_url||'')).join('|');
      const lh = !s.guildLayout ? '' : JSON.stringify(s.guildLayout);
      return gh + '##' + lh;
    }
    let lastGHash = '';

    // ── Controls (dirty-checked) ──
    function updateControls(s) {
      const h = cHash(s); if (h === lastCHash) return; lastCHash = h;
      const m = s.isMuted, c = s.isCameraOn, sc = s.isScreenSharing;

      // Mic button
      btnMic.className = 'w-11 h-11 flex items-center justify-center cursor-pointer transition-all duration-150 ' + (m ? 'bg-red-500/20 hover:bg-red-500/30' : 'hover:bg-white/10');
      btnMic.style.borderRadius = '10px 0 0 10px';
      iconMicOn.classList.toggle('hidden', m);
      iconMicOff.classList.toggle('hidden', !m);
      // Mic settings chevron adapts to mute state
      btnMicSettings.className = 'w-6 h-11 -ml-1 flex items-center justify-center cursor-pointer transition-all duration-150 ' + (m ? 'hover:bg-red-500/20' : 'hover:bg-white/10');
      btnMicSettings.style.borderRadius = '0 10px 10px 0';

      // Camera button
      btnCamera.className = 'w-11 h-11 flex items-center justify-center cursor-pointer transition-all duration-100 ' + (c ? 'bg-yellow-500/20 hover:bg-yellow-500/30' : 'hover:bg-white/10');
      btnCamera.style.borderRadius = c ? '10px 0 0 10px' : '10px';
      iconCamera.className = 'w-[20px] h-[20px] ' + (c ? 'text-yellow-400' : 'text-slate-200');
      // Camera settings button visibility
      if (c) { btnCamSettings.classList.remove('hidden'); btnCamSettings.classList.add('flex'); }
      else { btnCamSettings.classList.add('hidden'); btnCamSettings.classList.remove('flex'); }

      // Screen button
      btnScreen.className = 'w-11 h-11 flex items-center justify-center cursor-pointer transition-all duration-100 relative ' + (sc ? 'bg-green-500/20 hover:bg-green-500/30' : 'hover:bg-white/10');
      btnScreen.style.borderRadius = sc ? '10px 0 0 10px' : '10px';
      iconScreen.className = 'w-[20px] h-[20px] ' + (sc ? 'text-green-400' : 'text-slate-200');
      document.getElementById('screen-live-dot').classList.toggle('hidden', !sc);
      // Screen settings button visibility
      if (sc) { btnScrSettings.classList.remove('hidden'); btnScrSettings.classList.add('flex'); }
      else { btnScrSettings.classList.add('hidden'); btnScrSettings.classList.remove('flex'); }
    }

    // ── Participants (dirty-checked) ──
    function renderParticipants(s) {
      const h = pHash(s); if (h === lastPHash) return; lastPHash = h;
      channelNameEl.textContent = s.channelName || 'Ses Kanalı';
      const list = s.participants || [];
      countEl.textContent = list.length ? list.length + ' kişi' : '';
      if (!list.length) { participantsEl.innerHTML = ''; return; }

      let html = '';
      for (const p of list) {
        const speaking = p.isSpeaking, muted = p.isMuted;
        let rowCls = 'flex items-center gap-3';
        // Konuşmuyorsa (muted veya sessiz) saydam olsun
        if (!speaking) rowCls += ' opacity-60';
        const avatarBorder = speaking ? 'border-2 border-accent' : 'border-2 border-transparent';
        const avatarInner = p.avatar
          ? '<img src="'+esc(p.avatar)+'" class="w-full h-full object-cover" alt="" />'
          : '<span class="text-[11px] font-bold text-slate-400">'+initials(p.name)+'</span>';
        const nameColor = 'text-slate-200';
        // İkonlar: deafen, muted, kamera, ekran paylaşımı
        let icons = '';
        if (p.isDeafened) icons += DEAFEN_ICON;
        else if (muted) icons += MIC_OFF_ICON;
        if (p.isCameraOn) icons += '<svg class="w-4 h-4 text-yellow-400 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="m17 9.5l.658-.329c1.946-.973 2.92-1.46 3.63-1.02c.712.44.712 1.528.712 3.703v.292c0 2.176 0 3.263-.711 3.703c-.712.44-1.685-.047-3.63-1.02L17 14.5z"/><path fill="currentColor" fill-rule="evenodd" d="M2.908 5.462C2 6.57 2 8.212 2 11.5v1c0 3.287 0 4.931.908 6.038a4 4 0 0 0 .554.554C4.57 20 6.212 20 9.5 20c3.287 0 4.931 0 6.038-.908q.304-.25.554-.554C17 17.43 17 15.788 17 12.5v-1c0-3.287 0-4.931-.908-6.038a4 4 0 0 0-.554-.554C14.43 4 12.788 4 9.5 4c-3.287 0-4.931 0-6.038.908a4 4 0 0 0-.554.554" clip-rule="evenodd" opacity="0.5"/></svg>';
        if (p.isScreenSharing) icons += '<span class="flex-shrink-0 px-1.5 py-0.5 bg-red-500 text-white text-[9px] font-bold uppercase" style="border-radius:3px;">CANLI</span>';
        html += '<div class="'+rowCls+'">' +
          '<div class="w-8 h-8 bg-slate-800 flex items-center justify-center flex-shrink-0 overflow-hidden '+avatarBorder+'" style="border-radius:50%;">'+avatarInner+'</div>' +
          '<div class="flex flex-col flex-1 min-w-0"><span class="text-[13px] font-medium '+nameColor+' truncate">'+esc(p.name)+'</span></div>' +
          '<div class="flex items-center gap-1.5">'+icons+'</div></div>';
      }
      participantsEl.innerHTML = html;
    }

    // ── Guilds (server bar) ──
    let tooltipEl = null;
    let expandedFolders = {}; // folder toggle state

    function showTooltip(target, text) {
      hideTooltip();
      tooltipEl = document.createElement('div');
      tooltipEl.className = 'overlay-tooltip fixed z-[200] px-2.5 py-1 bg-slate-800/95 backdrop-blur-sm border border-slate-700/60 text-slate-100 text-[11px] font-medium shadow-xl shadow-black/40 pointer-events-none';
      tooltipEl.style.borderRadius = '8px';
      tooltipEl.style.whiteSpace = 'nowrap';
      tooltipEl.style.letterSpacing = '0.01em';
      tooltipEl.textContent = text;
      document.body.appendChild(tooltipEl);
      const r = target.getBoundingClientRect();
      const tw = tooltipEl.offsetWidth;
      tooltipEl.style.left = Math.max(4, r.left + r.width/2 - tw/2) + 'px';
      tooltipEl.style.top = (r.bottom + 8) + 'px';
    }
    function hideTooltip() {
      if (tooltipEl) { tooltipEl.remove(); tooltipEl = null; }
    }

    function guildById(id) {
      return (currentState.guilds || []).find(g => g.id === id);
    }

    function renderGuildIcon(g, size) {
      if (!g) return '';
      const sz = size || 8;
      const px = sz * 4;
      const ini = initials(g.name);
      const rad = Math.round(px * 0.22);
      const inner = g.avatar_url
        ? '<img src="'+esc(g.avatar_url)+'" class="w-full h-full object-cover" style="border-radius:'+rad+'px;" alt="" />'
        : '<span style="font-size:'+(px*0.3)+'px;font-weight:600;color:#94a3b8;letter-spacing:0.02em;">'+ini+'</span>';
      return '<div class="server-icon flex-shrink-0 flex items-center justify-center cursor-pointer overflow-hidden" style="border-radius:'+rad+'px;width:'+px+'px;height:'+px+'px;background:#1e293b;position:relative;" data-guild-id="'+esc(g.id)+'" data-guild-name="'+esc(g.name)+'">'
        + inner + '<div class="server-spinner"></div></div>';
    }

    function renderFolderPreview(children, color) {
      const previews = children.slice(0, 4);
      let grid = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5px;padding:3px;">';
      for (let i = 0; i < 4; i++) {
        const g = previews[i] ? guildById(previews[i].id) : null;
        const r = i===0?'3px 1px 1px 1px':i===1?'1px 3px 1px 1px':i===2?'1px 1px 1px 3px':'1px 1px 3px 1px';
        if (g && g.avatar_url) {
          grid += '<div style="width:13px;height:13px;overflow:hidden;border-radius:'+r+';background:#1e293b;"><img src="'+esc(g.avatar_url)+'" style="width:100%;height:100%;object-fit:cover;" alt="" /></div>';
        } else if (g) {
          grid += '<div style="width:13px;height:13px;overflow:hidden;border-radius:'+r+';background:#1e293b;display:flex;align-items:center;justify-content:center;"><span style="font-size:6px;font-weight:700;color:#94a3b8;">'+initials(g.name).charAt(0)+'</span></div>';
        } else {
          grid += '<div style="width:13px;height:13px;border-radius:'+r+';background:transparent;"></div>';
        }
      }
      grid += '</div>';
      return grid;
    }

    function renderGuilds(s) {
      const h = gHash(s); if (h === lastGHash) return; lastGHash = h;
      const guilds = s.guilds || [];
      const layout = s.guildLayout || [];
      if (!guilds.length) { serverBar.classList.add('hidden'); return; }
      serverBar.classList.remove('hidden');

      let html = '';
      if (layout.length > 0) {
        for (const item of layout) {
          if (item.type === 'folder' && item.children && item.children.length > 0) {
            const color = item.color || '#6366f1';
            const isOpen = !!expandedFolders[item.id];
            const fname = esc(item.name || 'Klasör');

            if (isOpen) {
              // Expanded folder
              html += '<div class="flex-shrink-0 flex items-center gap-1 px-1 py-0.5" style="border-radius:10px;background:'+esc(color)+'15;border:1px solid '+esc(color)+'30;" data-folder-toggle="'+esc(item.id)+'" data-folder-name="'+fname+'">';
              // Folder toggle button
              html += '<div class="flex-shrink-0 flex items-center justify-center cursor-pointer overflow-hidden" style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,'+esc(color)+'35,'+esc(color)+'15);border:1.5px solid '+esc(color)+';" data-folder-btn="'+esc(item.id)+'" data-folder-name="'+fname+'">';
              html += renderFolderPreview(item.children, color);
              html += '</div>';
              for (const child of item.children) {
                const g = guildById(child.id);
                if (g) html += renderGuildIcon(g, 8);
              }
              html += '</div>';
            } else {
              // Collapsed folder
              html += '<div class="flex-shrink-0 flex items-center justify-center cursor-pointer overflow-hidden" style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,'+esc(color)+'25,'+esc(color)+'10);border:1.5px solid '+esc(color)+'50;" data-folder-btn="'+esc(item.id)+'" data-folder-name="'+fname+'">';
              html += renderFolderPreview(item.children, color);
              html += '</div>';
            }
          } else if (item.type === 'guild') {
            const g = guildById(item.id);
            if (g) html += renderGuildIcon(g, 8);
          }
        }
      } else {
        for (const g of guilds) html += renderGuildIcon(g, 8);
      }

      serverListEl.innerHTML = html;
      bindGuildEvents();
    }

    let loadingGuildId = null;

    function bindGuildEvents() {
      serverListEl.querySelectorAll('.server-icon').forEach(el => {
        el.addEventListener('mouseenter', () => { if (!el.classList.contains('loading')) showTooltip(el, el.dataset.guildName); });
        el.addEventListener('mouseleave', hideTooltip);
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const gid = el.dataset.guildId;
          if (!gid || loadingGuildId) return;
          loadingGuildId = gid;
          el.classList.add('loading');
          hideTooltip();
          ipcRenderer.send('overlay-navigate-server', gid);
        });
      });
      serverListEl.querySelectorAll('[data-folder-btn]').forEach(el => {
        el.addEventListener('mouseenter', () => showTooltip(el, el.dataset.folderName));
        el.addEventListener('mouseleave', hideTooltip);
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const fid = el.dataset.folderBtn;
          expandedFolders[fid] = !expandedFolders[fid];
          lastGHash = '';
          renderGuilds(currentState);
        });
      });
    }

    // Navigate done — overlay kapanacak, loading state'i temizle
    ipcRenderer.on('overlay-navigate-done', () => {
      loadingGuildId = null;
      serverListEl.querySelectorAll('.server-icon.loading').forEach(el => el.classList.remove('loading'));
    });

    // ── Drag ──
    let dragging = false, dx = 0, dy = 0;
    widgetHeader.addEventListener('mousedown', e => {
      dragging = true;
      const r = widget.getBoundingClientRect();
      dx = e.clientX - r.left; dy = e.clientY - r.top;
      widget.style.transition = 'none'; e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      widget.style.left = Math.max(0, Math.min(innerWidth - widget.offsetWidth, e.clientX - dx)) + 'px';
      widget.style.top = Math.max(0, Math.min(innerHeight - widget.offsetHeight, e.clientY - dy)) + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (dragging) {
        dragging = false;
        widget.style.transition = '';
        // Save position for passive overlay
        const rect = widget.getBoundingClientRect();
        const pos = { x: rect.left, y: rect.top };
        ipcRenderer.send('overlay-widget-position', pos);
        localStorage.setItem('overlay-widget-position', JSON.stringify(pos));
      }
    });

    ipcRenderer.on('overlay-set-widget-position', (_e, pos) => {
      if (pos && widget) {
        widget.style.left = pos.x + 'px';
        widget.style.top = pos.y + 'px';
        localStorage.setItem('overlay-widget-position', JSON.stringify(pos));
      }
    });

    // Restore widget position from localStorage on load
    try {
      const savedPos = JSON.parse(localStorage.getItem('overlay-widget-position') || 'null');
      if (savedPos && widget) {
        widget.style.left = savedPos.x + 'px';
        widget.style.top = savedPos.y + 'px';
      }
    } catch(e) {}

    // ── Button handlers ──
    btnMic.onclick = () => ipcRenderer.send('overlay-control', 'toggle-mic');
    btnMicSettings.onclick = () => ipcRenderer.send('overlay-control', 'open-settings');
    btnCamera.onclick = () => {
      if (currentState.isCameraOn) {
        ipcRenderer.send('overlay-control', 'toggle-camera');
      } else {
        openSourceModal('camera');
      }
    };
    btnCamSettings.onclick = () => ipcRenderer.send('overlay-control', 'open-camera-quality');
    btnScreen.onclick = () => {
      if (currentState.isScreenSharing) {
        ipcRenderer.send('overlay-control', 'toggle-screen');
      } else {
        openSourceModal('applications');
      }
    };
    btnScrSettings.onclick = () => ipcRenderer.send('overlay-control', 'open-screen-quality');
    btnDisconnect.onclick = () => ipcRenderer.send('overlay-control', 'disconnect');
    document.getElementById('widget-close').onclick = () => ipcRenderer.send('overlay-close');
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (!sourceModal.classList.contains('hidden')) { closeSourceModal(); }
        else if (!chatDropdown.classList.contains('hidden')) { closeChatDropdown(); }
        else { ipcRenderer.send('overlay-close'); }
      }
    });

    // Boşluğa tıklayınca overlay'i kapat
    document.body.addEventListener('click', (e) => {
      if (e.target === document.body || e.target === document.documentElement) {
        ipcRenderer.send('overlay-close');
      }
    });

    // ══════════ SOURCE PICKER MODAL LOGIC ══════════
    const sourceModal = document.getElementById('source-modal');
    const sourceGrid = document.getElementById('source-grid');
    const sourceModalTitle = document.getElementById('source-modal-title');
    const shareBtn = document.getElementById('source-modal-share');
    const audioToggle = document.getElementById('audio-toggle');
    const audioToggleDot = document.getElementById('audio-toggle-dot');
    const audioToggleWrap = document.getElementById('audio-toggle-wrap');

    let modalActiveTab = 'applications';
    let modalSelectedId = null;
    let modalShareAudio = true;
    let modalSources = { windows: [], screens: [] };
    let modalCameras = [];

    // Audio toggle
    updateAudioToggleUI();
    audioToggleWrap.onclick = () => {
      modalShareAudio = !modalShareAudio;
      updateAudioToggleUI();
    };
    function updateAudioToggleUI() {
      audioToggle.style.background = modalShareAudio ? '#adff08' : '#334155';
      audioToggleDot.style.transform = modalShareAudio ? 'translateX(16px)' : 'translateX(0)';
    }

    // Tab switching
    document.querySelectorAll('.source-tab').forEach(btn => {
      btn.onclick = () => {
        modalActiveTab = btn.dataset.tab;
        modalSelectedId = null;
        shareBtn.disabled = true;
        updateTabUI();
        renderSources();
      };
    });

    function updateTabUI() {
      document.querySelectorAll('.source-tab').forEach(t => {
        const active = t.dataset.tab === modalActiveTab;
        t.className = 'source-tab flex-1 flex items-center justify-center gap-1.5 py-2 text-[12px] font-medium transition-all ' +
          (active ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-slate-300 hover:bg-slate-800');
      });
      audioToggleWrap.style.display = modalActiveTab === 'camera' ? 'none' : 'flex';
      sourceModalTitle.textContent = modalActiveTab === 'camera' ? 'Kamera Seç' : 'Ekranı Paylaş';
    }

    async function fetchSources() {
      try {
        const results = await ipcRenderer.invoke('get-screen-sources', ['window', 'screen']);
        modalSources.windows = results.filter(s => s.id.startsWith('window:'));
        modalSources.screens = results.filter(s => s.id.startsWith('screen:'));
      } catch (e) { console.error('Failed to fetch sources:', e); }
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        modalCameras = devices.filter(d => d.kind === 'videoinput');
      } catch (e) { modalCameras = []; }
    }

    function renderSources() {
      let items = [];
      if (modalActiveTab === 'applications') items = modalSources.windows;
      else if (modalActiveTab === 'screens') items = modalSources.screens;
      else if (modalActiveTab === 'camera') { renderCameras(); return; }

      if (!items.length) {
        sourceGrid.innerHTML = '<div class="flex items-center justify-center h-32 text-slate-500 text-[12px]">Kaynak bulunamadı</div>';
        return;
      }

      let html = '<div class="grid grid-cols-2 gap-2">';
      for (const s of items) {
        const sel = s.id === modalSelectedId;
        html += '<button data-source-id="'+esc(s.id)+'" class="source-item relative group cursor-pointer overflow-hidden transition-all border-2 '
          + (sel ? 'border-accent shadow-[0_0_8px_rgba(173,255,8,0.15)]' : 'border-transparent hover:border-slate-700')
          + '" style="border-radius:6px;">'
          + '<div class="aspect-video bg-slate-950 relative">'
          + (s.thumbnail ? '<img src="'+esc(s.thumbnail)+'" class="w-full h-full object-contain bg-slate-950" />' : '')
          + '<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>'
          + '<div class="absolute bottom-0 left-0 right-0 p-1.5"><div class="flex items-center gap-1">'
          + (s.appIcon ? '<img src="'+esc(s.appIcon)+'" class="w-3 h-3" style="border-radius:2px;" />' : '')
          + '<span class="text-white text-[10px] font-medium truncate">'+esc(s.name)+'</span>'
          + '</div></div>'
          + (sel ? '<div class="absolute top-1.5 right-1.5 w-4 h-4 bg-accent flex items-center justify-center" style="border-radius:50%;"><svg class="w-2.5 h-2.5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>' : '')
          + '</div></button>';
      }
      html += '</div>';
      sourceGrid.innerHTML = html;
      sourceGrid.querySelectorAll('.source-item').forEach(el => {
        el.onclick = () => { modalSelectedId = el.dataset.sourceId; shareBtn.disabled = false; renderSources(); };
      });
    }

    function renderCameras() {
      if (!modalCameras.length) {
        sourceGrid.innerHTML = '<div class="flex items-center justify-center h-32 text-slate-500 text-[12px]">Kamera bulunamadı</div>';
        return;
      }
      let html = '<div class="grid grid-cols-2 gap-2">';
      for (const d of modalCameras) {
        const sel = d.deviceId === modalSelectedId;
        html += '<button data-device-id="'+esc(d.deviceId)+'" class="camera-item relative cursor-pointer overflow-hidden transition-all p-4 border-2 '
          + (sel ? 'bg-accent/10 border-accent shadow-[0_0_8px_rgba(173,255,8,0.15)]' : 'bg-slate-800 border-transparent hover:bg-slate-700 hover:border-slate-600')
          + '" style="border-radius:6px;">'
          + '<div class="flex flex-col items-center justify-center gap-1.5">'
          + '<span class="flex w-10 h-10 items-center justify-center '+(sel ? 'bg-accent/20' : 'bg-slate-700')+'" style="border-radius:8px;">'
          + '<svg class="w-5 h-5 '+(sel ? 'text-accent' : 'text-slate-400')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>'
          + '</span>'
          + '<span class="text-[10px] font-medium text-center truncate max-w-full '+(sel ? 'text-accent' : 'text-slate-300')+'">'+(esc(d.label) || 'Kamera')+'</span>'
          + '</div>'
          + (sel ? '<div class="absolute top-1.5 right-1.5 w-4 h-4 bg-accent flex items-center justify-center" style="border-radius:50%;"><svg class="w-2.5 h-2.5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>' : '')
          + '</button>';
      }
      html += '</div>';
      sourceGrid.innerHTML = html;
      sourceGrid.querySelectorAll('.camera-item').forEach(el => {
        el.onclick = () => { modalSelectedId = el.dataset.deviceId; shareBtn.disabled = false; renderCameras(); };
      });
    }

    async function openSourceModal(tab) {
      modalActiveTab = tab;
      modalSelectedId = null;
      shareBtn.disabled = true;
      modalShareAudio = true;
      updateAudioToggleUI();
      updateTabUI();
      sourceGrid.innerHTML = '<div class="flex items-center justify-center h-32"><div class="w-5 h-5 border-2 border-accent/30 border-t-accent animate-spin" style="border-radius:50%;"></div></div>';
      sourceModal.classList.remove('hidden');
      await fetchSources();
      renderSources();
    }

    function closeSourceModal() {
      sourceModal.classList.add('hidden');
      sourceGrid.innerHTML = '';
      modalSelectedId = null;
    }

    document.getElementById('source-modal-close').onclick = closeSourceModal;
    document.getElementById('source-modal-cancel').onclick = closeSourceModal;
    document.getElementById('source-modal-backdrop').onclick = closeSourceModal;

    shareBtn.onclick = () => {
      if (!modalSelectedId) return;
      if (modalActiveTab === 'camera') {
        ipcRenderer.send('overlay-control', 'share-camera:' + modalSelectedId);
      } else {
        ipcRenderer.send('overlay-control', 'share-screen:' + modalSelectedId + ':' + modalShareAudio);
      }
      closeSourceModal();
    };

    // ── IPC ──
    ipcRenderer.on('overlay-update', (_e, state) => {
      currentState = { ...currentState, ...state };
      const connected = currentState.participants && currentState.participants.length > 0;
      widget.classList.toggle('hidden', !connected);
      controlBar.classList.toggle('hidden', !connected);
      if (connected) { renderParticipants(currentState); updateControls(currentState); }
      renderGuilds(currentState);
      // Update chat widget guild list
      updateChatGuilds(currentState.guilds);
    });
    ipcRenderer.on('overlay-position', () => {});

    // ── Saat ──
    const clockEl = document.getElementById('overlay-clock');
    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ── Pil ──
    const batteryWrap = document.getElementById('battery-wrap');
    const batteryFill = document.getElementById('battery-fill');
    const batteryPct = document.getElementById('battery-pct');
    const batteryCharging = document.getElementById('battery-charging');

    if (navigator.getBattery) {
      navigator.getBattery().then(batt => {
        function updateBattery() {
          const pct = Math.round(batt.level * 100);
          batteryWrap.classList.remove('hidden');
          batteryWrap.classList.add('flex');
          batteryFill.style.width = pct + '%';
          batteryPct.textContent = pct + '%';
          if (pct <= 15) { batteryFill.className = 'h-full bg-red-400'; batteryFill.style.borderRadius = '1px'; }
          else if (pct <= 35) { batteryFill.className = 'h-full bg-yellow-400'; batteryFill.style.borderRadius = '1px'; }
          else { batteryFill.className = 'h-full bg-accent'; batteryFill.style.borderRadius = '1px'; }
          batteryCharging.classList.toggle('hidden', !batt.charging);
        }
        updateBattery();
        batt.addEventListener('levelchange', updateBattery);
        batt.addEventListener('chargingchange', updateBattery);
      }).catch(() => {});
    }

    // ══════════ CHAT WIDGET SETTINGS ══════════
    const chatDropdown = document.getElementById('chat-dropdown');
    const btnChatDropdown = document.getElementById('btn-chat-dropdown');
    const chatToggle = document.getElementById('chat-toggle');
    const chatToggleDot = document.getElementById('chat-toggle-dot');
    const chatChannelSelector = document.getElementById('chat-channel-selector');
    const chatGuildSelect = document.getElementById('chat-guild-select');
    const chatChannelSelect = document.getElementById('chat-channel-select');
    const chatChannelWrap = document.getElementById('chat-channel-wrap');
    const chatPreview = document.getElementById('chat-preview');
    const chatPreviewHeader = document.getElementById('chat-preview-header');
    const chatPreviewLabel = document.getElementById('chat-preview-label');

    // Dropdown toggle
    btnChatDropdown.onclick = (e) => {
      e.stopPropagation();
      if (chatDropdown.classList.contains('hidden')) {
        chatDropdown.classList.remove('hidden');
      } else {
        closeChatDropdown();
      }
    };
    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!chatDropdown.contains(e.target) && e.target !== btnChatDropdown && !btnChatDropdown.contains(e.target)) {
        if (!chatDropdown.classList.contains('hidden')) {
          closeChatDropdown();
        }
      }
    });

    // Revert unsaved changes when dropdown closes without saving
    function closeChatDropdown() {
      if (chatIsDirty()) {
        // Revert to initial (API) state
        chatWidgetEnabled = chatInitialState.enabled;
        chatSelectedGuild = chatInitialState.guildId;
        chatSelectedChannel = chatInitialState.channelId;
        chatSelectedChannelName = chatInitialState.channelName;
        chatWidth = chatInitialState.width;
        chatHeight = chatInitialState.height;
        // Update UI
        updateChatToggleUI();
        chatChannelSelector.classList.toggle('hidden', !chatWidgetEnabled);
        chatPreview.classList.toggle('hidden', !chatWidgetEnabled);
        if (chatSelectedGuild) {
          chatGuildSelect.value = chatSelectedGuild;
          chatChannelWrap.classList.remove('hidden');
          chatChannelWrap.classList.add('flex');
          // Re-request channels for the original guild
          ipcRenderer.send('overlay-chat-request-channels', chatSelectedGuild);
        } else {
          chatGuildSelect.value = '';
          chatChannelWrap.classList.add('hidden');
          chatChannelWrap.classList.remove('flex');
        }
        if (chatSelectedChannel) chatChannelSelect.value = chatSelectedChannel;
        chatPreviewLabel.textContent = chatSelectedChannelName ? '#' + chatSelectedChannelName : 'Sohbet burada görünecek';
        // Revert sliders
        chatWidthSlider.value = chatWidth;
        chatWidthValue.textContent = chatWidth + 'px';
        chatHeightSlider.value = chatHeight;
        chatHeightValue.textContent = chatHeight + 'px';
        chatPreviewHeader.style.width = chatWidth + 'px';
        chatPreviewHeader.style.height = chatHeight + 'px';
        ipcRenderer.send('overlay-chat-size', { width: chatWidth, height: chatHeight });
        // Send reverted config to main process
        sendChatConfig();
        updateChatActions();
      }
      chatDropdown.classList.add('hidden');
    }

    let chatWidgetEnabled = false;
    let chatSelectedGuild = '';
    let chatSelectedChannel = '';
    let chatSelectedChannelName = '';
    let chatWidth = 320;
    let chatHeight = 400;

    // Restore from localStorage
    try {
      const saved = JSON.parse(localStorage.getItem('overlay-chat-state') || 'null');
      if (saved) {
        chatWidgetEnabled = saved.enabled || false;
        chatSelectedGuild = saved.guildId || '';
        chatSelectedChannel = saved.channelId || '';
        chatSelectedChannelName = saved.channelName || '';
        chatWidth = saved.width || 320;
        chatHeight = saved.height || 400;
      }
    } catch(e) {}

    // Persist to localStorage
    function saveChatState() {
      localStorage.setItem('overlay-chat-state', JSON.stringify({
        enabled: chatWidgetEnabled,
        guildId: chatSelectedGuild,
        channelId: chatSelectedChannel,
        channelName: chatSelectedChannelName,
        width: chatWidth,
        height: chatHeight,
      }));
    }

    function updateChatToggleUI() {
      chatToggle.style.background = chatWidgetEnabled ? '#adff08' : '#334155';
      chatToggleDot.style.transform = chatWidgetEnabled ? 'translateX(16px)' : 'translateX(0)';
      // Update top bar button color when chat is enabled
      const btnIcon = btnChatDropdown.querySelector('svg');
      if (btnIcon) btnIcon.className = 'w-4 h-4 ' + (chatWidgetEnabled ? 'text-accent' : 'text-slate-300');
    }

    // Size sliders
    const chatWidthSlider = document.getElementById('chat-width-slider');
    const chatHeightSlider = document.getElementById('chat-height-slider');
    const chatWidthValue = document.getElementById('chat-width-value');
    const chatHeightValue = document.getElementById('chat-height-value');

    chatWidthSlider.oninput = () => {
      chatWidth = parseInt(chatWidthSlider.value);
      chatWidthValue.textContent = chatWidth + 'px';
      chatPreviewHeader.style.width = chatWidth + 'px';
      ipcRenderer.send('overlay-chat-size', { width: chatWidth, height: chatHeight });
      updateChatActions();
    };
    chatHeightSlider.oninput = () => {
      chatHeight = parseInt(chatHeightSlider.value);
      chatHeightValue.textContent = chatHeight + 'px';
      chatPreviewHeader.style.height = chatHeight + 'px';
      ipcRenderer.send('overlay-chat-size', { width: chatWidth, height: chatHeight });
      updateChatActions();
    };

    function sendChatConfig() {
      saveChatState();
      ipcRenderer.send('overlay-control', 'chat-config:' + JSON.stringify({
        enabled: chatWidgetEnabled,
        guildId: chatSelectedGuild || null,
        channelId: chatSelectedChannel || null,
        channelName: chatSelectedChannelName || null,
        width: chatWidth,
        height: chatHeight,
      }));
    }

    // ── Save/Cancel & Dirty State ──
    const chatActions = document.getElementById('chat-actions');
    const chatBtnSave = document.getElementById('chat-btn-save');
    const chatBtnCancel = document.getElementById('chat-btn-cancel');

    // Snapshot of initial state (from /me settings) to detect changes
    let chatInitialState = {
      enabled: chatWidgetEnabled,
      guildId: chatSelectedGuild,
      channelId: chatSelectedChannel,
      channelName: chatSelectedChannelName,
      width: chatWidth,
      height: chatHeight,
    };

    function chatIsDirty() {
      return chatWidgetEnabled !== chatInitialState.enabled ||
        chatSelectedGuild !== chatInitialState.guildId ||
        chatSelectedChannel !== chatInitialState.channelId ||
        chatWidth !== chatInitialState.width ||
        chatHeight !== chatInitialState.height;
    }

    function updateChatActions() {
      if (chatIsDirty()) {
        chatActions.classList.remove('hidden');
        chatActions.classList.add('flex');
      } else {
        chatActions.classList.add('hidden');
        chatActions.classList.remove('flex');
      }
    }

    // Override sendChatConfig to also check dirty state
    const _origSendChatConfig = sendChatConfig;
    // Patch: after every config change, update action buttons
    function sendChatConfigWithDirty() {
      _origSendChatConfig();
      updateChatActions();
    }
    // Re-bind toggle
    chatToggle.parentElement.onclick = () => {
      chatWidgetEnabled = !chatWidgetEnabled;
      updateChatToggleUI();
      chatChannelSelector.classList.toggle('hidden', !chatWidgetEnabled);
      chatPreview.classList.toggle('hidden', !chatWidgetEnabled);
      sendChatConfigWithDirty();
    };
    // Re-bind guild select
    chatGuildSelect.onchange = () => {
      chatSelectedGuild = chatGuildSelect.value;
      chatSelectedChannel = '';
      chatChannelSelect.innerHTML = '<option value="">Kanal seç...</option>';
      if (chatSelectedGuild) {
        chatChannelWrap.classList.remove('hidden');
        chatChannelWrap.classList.add('flex');
        ipcRenderer.send('overlay-chat-request-channels', chatSelectedGuild);
      } else {
        chatChannelWrap.classList.add('hidden');
        chatChannelWrap.classList.remove('flex');
      }
      sendChatConfigWithDirty();
    };
    // Re-bind channel select
    chatChannelSelect.onchange = () => {
      chatSelectedChannel = chatChannelSelect.value;
      chatSelectedChannelName = chatChannelSelect.options[chatChannelSelect.selectedIndex]?.text || '';
      chatPreviewLabel.textContent = chatSelectedChannelName ? '#' + chatSelectedChannelName : 'Sohbet burada görünecek';
      sendChatConfigWithDirty();
    };

    // Save button — persist to API via main process
    chatBtnSave.onclick = () => {
      ipcRenderer.send('overlay-chat-save-settings');
      chatInitialState = {
        enabled: chatWidgetEnabled,
        guildId: chatSelectedGuild,
        channelId: chatSelectedChannel,
        channelName: chatSelectedChannelName,
        width: chatWidth,
        height: chatHeight,
      };
      updateChatActions();
      chatDropdown.classList.add('hidden');
    };

    // Cancel button — revert to initial state
    chatBtnCancel.onclick = () => {
      closeChatDropdown();
    };

    // When overlay receives initial config from main (from /me settings), update initial state
    ipcRenderer.on('overlay-chat-initial-settings', (_e, config) => {
      if (!config) return;
      chatInitialState = {
        enabled: config.enabled || false,
        guildId: config.guildId || '',
        channelId: config.channelId || '',
        channelName: config.channelName || '',
        width: config.width || 320,
        height: config.height || 400,
      };
      // Also apply as current state
      chatWidgetEnabled = chatInitialState.enabled;
      chatSelectedGuild = chatInitialState.guildId;
      chatSelectedChannel = chatInitialState.channelId;
      chatSelectedChannelName = chatInitialState.channelName;
      chatWidth = chatInitialState.width;
      chatHeight = chatInitialState.height;
      updateChatToggleUI();
      chatChannelSelector.classList.toggle('hidden', !chatWidgetEnabled);
      chatPreview.classList.toggle('hidden', !chatWidgetEnabled);
      if (chatSelectedGuild) {
        chatGuildSelect.value = chatSelectedGuild;
        chatChannelWrap.classList.remove('hidden');
        chatChannelWrap.classList.add('flex');
        ipcRenderer.send('overlay-chat-request-channels', chatSelectedGuild);
      }
      if (chatSelectedChannel) chatChannelSelect.value = chatSelectedChannel;
      chatPreviewLabel.textContent = chatSelectedChannelName ? '#' + chatSelectedChannelName : 'Sohbet burada görünecek';
      // Update sliders
      chatWidthSlider.value = chatWidth;
      chatWidthValue.textContent = chatWidth + 'px';
      chatHeightSlider.value = chatHeight;
      chatHeightValue.textContent = chatHeight + 'px';
      chatPreviewHeader.style.width = chatWidth + 'px';
      chatPreviewHeader.style.height = chatHeight + 'px';
      updateChatActions();
    });

    // Populate guilds from overlay state
    function updateChatGuilds(guilds) {
      if (!guilds || !guilds.length) return;
      const current = chatGuildSelect.value || chatSelectedGuild;
      chatGuildSelect.innerHTML = '<option value="">Sunucu seç...</option>';
      for (const g of guilds) {
        const opt = document.createElement('option');
        opt.value = g.id;
        opt.textContent = g.name;
        chatGuildSelect.appendChild(opt);
      }
      // Restore selected guild (from config that arrived before guild list)
      if (current) {
        chatGuildSelect.value = current;
        // If guild is selected, show channel wrap and request channels
        if (chatGuildSelect.value === current) {
          chatChannelWrap.classList.remove('hidden');
          chatChannelWrap.classList.add('flex');
          // Request channels if we don't have them yet
          if (chatChannelSelect.options.length <= 1) {
            ipcRenderer.send('overlay-chat-request-channels', current);
          }
        }
      }
    }

    // Receive channel list from main process
    ipcRenderer.on('overlay-chat-channels', (_e, channels) => {
      chatChannelSelect.innerHTML = '<option value="">Kanal seç...</option>';
      for (const ch of channels) {
        const opt = document.createElement('option');
        opt.value = ch.id;
        opt.textContent = ch.name;
        chatChannelSelect.appendChild(opt);
      }
      if (chatSelectedChannel) chatChannelSelect.value = chatSelectedChannel;
    });

    // Receive config from main process (restore state)
    ipcRenderer.on('overlay-chat-config', (_e, config) => {
      if (!config) return;
      chatWidgetEnabled = config.enabled || false;
      chatSelectedGuild = config.guildId || '';
      chatSelectedChannel = config.channelId || '';
      chatSelectedChannelName = config.channelName || '';
      chatWidth = config.width || 320;
      chatHeight = config.height || 400;
      // Also update initial state (this is the source of truth from API/store)
      chatInitialState = {
        enabled: chatWidgetEnabled,
        guildId: chatSelectedGuild,
        channelId: chatSelectedChannel,
        channelName: chatSelectedChannelName,
        width: chatWidth,
        height: chatHeight,
      };
      updateChatToggleUI();
      chatChannelSelector.classList.toggle('hidden', !chatWidgetEnabled);
      chatPreview.classList.toggle('hidden', !chatWidgetEnabled);
      if (chatSelectedGuild) {
        chatGuildSelect.value = chatSelectedGuild;
        chatChannelWrap.classList.remove('hidden');
        chatChannelWrap.classList.add('flex');
      } else {
        chatChannelWrap.classList.add('hidden');
        chatChannelWrap.classList.remove('flex');
      }
      if (chatSelectedChannel) chatChannelSelect.value = chatSelectedChannel;
      chatPreviewLabel.textContent = chatSelectedChannelName ? '#' + chatSelectedChannelName : 'Sohbet burada görünecek';
      // Update sliders
      chatWidthSlider.value = chatWidth;
      chatWidthValue.textContent = chatWidth + 'px';
      chatHeightSlider.value = chatHeight;
      chatHeightValue.textContent = chatHeight + 'px';
      chatPreviewHeader.style.width = chatWidth + 'px';
      chatPreviewHeader.style.height = chatHeight + 'px';
      updateChatActions();
    });

    // Chat preview drag
    let chatDragging = false, chatDx = 0, chatDy = 0;
    chatPreviewHeader.addEventListener('mousedown', e => {
      chatDragging = true;
      const r = chatPreview.getBoundingClientRect();
      chatDx = e.clientX - r.left; chatDy = e.clientY - r.top;
      chatPreview.style.transition = 'none'; e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!chatDragging) return;
      chatPreview.style.left = Math.max(0, Math.min(innerWidth - chatPreview.offsetWidth, e.clientX - chatDx)) + 'px';
      chatPreview.style.top = Math.max(0, Math.min(innerHeight - chatPreview.offsetHeight, e.clientY - chatDy)) + 'px';
      chatPreview.style.bottom = 'auto';
      chatPreview.style.right = 'auto';
    });
    document.addEventListener('mouseup', () => {
      if (chatDragging) {
        chatDragging = false;
        chatPreview.style.transition = '';
        const rect = chatPreview.getBoundingClientRect();
        ipcRenderer.send('overlay-chat-position', { x: rect.left, y: rect.top });
      }
    });

    // Restore chat widget UI from localStorage on load
    updateChatToggleUI();
    chatChannelSelector.classList.toggle('hidden', !chatWidgetEnabled);
    chatPreview.classList.toggle('hidden', !chatWidgetEnabled);
    if (chatSelectedGuild) {
      chatGuildSelect.value = chatSelectedGuild;
      chatChannelWrap.classList.remove('hidden');
      chatChannelWrap.classList.add('flex');
    }
    if (chatSelectedChannel) chatChannelSelect.value = chatSelectedChannel;
    chatPreviewLabel.textContent = chatSelectedChannelName ? '#' + chatSelectedChannelName : 'Sohbet burada görünecek';
    // Send saved config to main process on load
    if (chatWidgetEnabled) {
      sendChatConfig();
      if (chatSelectedGuild) {
        ipcRenderer.send('overlay-chat-request-channels', chatSelectedGuild);
      }
    }

    ipcRenderer.send('overlay-ready');
  </script>
</body>
</html>
